  <!-- Portfolio Grid + Filter + Uniform Tiles -->
  <style>
    /* ===== FILTERABLE GRID BASE ===== */
    #portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
      grid-auto-rows: min-content;
      align-content: start;
    }

    #portfolio-grid figure {
      margin: 0;
    }

    /* Hidden items must not take up space */
    #portfolio-grid .grid-item.is-hidden {
      display: none !important;
    }

    #portfolio-grid .grid-item:not(.is-hidden) {
      display: block;
    }

    /* ===== NEW: UNIFORM TILE SIZING ===== */
    #portfolio-grid .grid-item {
      position: relative;
      aspect-ratio: 4 / 3;
      /* uniform tiles */
      overflow: hidden;
      border-radius: 10px;
      background: var(--light-gray, #f5f5f5);
    }

    #portfolio-grid .grid-item a {
      display: block;
      height: 100%;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      color: inherit;
    }

    #portfolio-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* uniform crop */
      display: block;
      transition: transform .35s ease, filter .35s ease;
      will-change: transform;
    }

    #portfolio-grid .grid-item:hover img {
      transform: scale(1.05);
      /* subtle hover zoom */
      filter: brightness(0.95);
    }

    /* ===== NEW: SIMPLE LIGHTBOX ===== */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    #lightbox.is-open {
      display: flex;
    }

    #lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      /* show the whole photo */
      box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
      border-radius: 8px;
      background: #111;
    }
  </style>

  <script>
    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Filter functionality
    document.addEventListener('DOMContentLoaded', function () {
      const btns = Array.from(document.querySelectorAll('.filter-btn'));
      const items = Array.from(document.querySelectorAll('#portfolio-grid .grid-item'));

      function applyFilter(filter) {
        let visibleCount = 0;
        items.forEach(item => {
          const match = filter === 'all' || item.dataset.cat === filter;
          if (match) {
            item.classList.remove('is-hidden');
            item.style.display = '';
            visibleCount++;
          } else {
            item.classList.add('is-hidden');
            item.style.display = 'none';
          }
        });
      }

      function setActive(btn) {
        btns.forEach(b => {
          b.classList.toggle('is-active', b === btn);
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
      }

      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          const filter = btn.dataset.filter;
          setActive(btn);
          applyFilter(filter);
        });

        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            btn.click();
          }
        });
      });

      // Optional: read ?filter=family from URL
      const urlParams = new URLSearchParams(window.location.search);
      const start = (urlParams.get('filter') || 'all').toLowerCase();
      const startBtn = btns.find(b => b.dataset.filter === start) || btns[0];
      setActive(startBtn);
      applyFilter(startBtn.dataset.filter);
    });

    // ===== NEW: Simple Lightbox (works with filter) =====
    (function () {
      const lb = document.getElementById('lightbox');
      const lbImg = lb.querySelector('img');

      document.addEventListener('click', (e) => {
        const a = e.target.closest('a.lb');
        if (!a) return;
        e.preventDefault();
        lbImg.src = a.getAttribute('href');
        lb.classList.add('is-open');
        lb.setAttribute('aria-hidden', 'false');
      });

      // Close on click on backdrop or ESC
      lb.addEventListener('click', (e) => {
        if (e.target === lb) closeLB();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLB();
      });

      function closeLB() {
        lb.classList.remove('is-open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.removeAttribute('src');
      }
    })();
  </script>
